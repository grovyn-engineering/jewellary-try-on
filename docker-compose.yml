services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80"
    networks:
      - dokploy-network
    depends_on:
      - photo-check-backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurevya-app.rule=Host(`nishhair.grovyn.in`)"
      - "traefik.http.routers.aurevya-app.entrypoints=websecure"
      - "traefik.http.routers.aurevya-app.tls.certResolver=letsencrypt"
      - "traefik.http.services.aurevya-app.loadbalancer.server.port=80"

  photo-check-backend:
    build:
      context: ./backend/velura-photo-check
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ALLOWED_ORIGINS=*
      - VMODEL_API_KEY=${VMODEL_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
