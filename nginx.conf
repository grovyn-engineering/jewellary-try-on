events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # Increase body size for base64 image uploads (portraits + jewellery)
    client_max_body_size 20M;

    upstream backend {
        server photo-check-backend:8000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Frontend: React SPA — all unknown routes serve index.html ──
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Backend: /api/* proxied to FastAPI ──
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Try-on generation can take up to 3 minutes (VModel polling)
            proxy_connect_timeout 10s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
            client_max_body_size 20M;
        }

        # ── Backend: /photo-check (non-prefixed endpoint) ──
        location /photo-check {
            proxy_pass http://backend/photo-check;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 20M;
        }

        # ── Health endpoints ──
        location /healthz {
            proxy_pass http://backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://backend/readyz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
